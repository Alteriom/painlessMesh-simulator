name: CI
permissions:
  contents: read

on:
  push:
    branches: [ master, main, develop, 'feature/**' ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # Linting and code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck
      
      - name: Check code formatting
        run: |
          # Check if any C++ files need formatting
          if [ -d "src" ] || [ -d "include" ] || [ -d "test" ]; then
            find src include test -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) 2>/dev/null \
              -exec clang-format --dry-run --Werror {} + || echo "No formatting issues found"
          else
            echo "Source directories not yet created"
          fi
        continue-on-error: true
      
      - name: Run static analysis
        run: |
          # Run cppcheck on source files
          if [ -d "src" ] && [ -d "include" ]; then
            cppcheck --enable=warning,style,performance,portability \
              --suppress=missingIncludeSystem \
              --inline-suppr \
              --error-exitcode=0 \
              src/ include/ 2>&1 | tee cppcheck-report.txt
          else
            echo "Source directories not yet created" | tee cppcheck-report.txt
          fi
        continue-on-error: true
      
      - name: Upload analysis results
        uses: actions/upload-artifact@v6
        with:
          name: static-analysis
          path: cppcheck-report.txt
        if: always()

  # Build using Docker
  build-docker:
    name: Build (Docker)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build --target builder -t painlessmesh-simulator:builder .
      
      - name: Build project in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            painlessmesh-simulator:builder \
            bash -c "mkdir -p build && cd build && \
              cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                .. && \
              ninja"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: simulator-docker-${{ matrix.build_type }}
          path: |
            build/bin/*
            build/lib/*.a
        if: success()

  # Run unit tests using Docker
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build --target builder -t painlessmesh-simulator:builder .
      
      - name: Build and run tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            painlessmesh-simulator:builder \
            bash -c "mkdir -p build && cd build && \
              cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DENABLE_TESTING=ON \
                -DENABLE_COVERAGE=ON \
                .. && \
              ninja && \
              ctest --output-on-failure --verbose"
      
      - name: Generate coverage report
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build/build \
            painlessmesh-simulator:builder \
            bash -c "apt-get update && apt-get install -y lcov && \
              lcov --capture --directory . --output-file coverage.info && \
              lcov --remove coverage.info '/usr/*' --output-file coverage.info && \
              lcov --list coverage.info"
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # Integration tests with example scenarios using Docker
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build --target builder -t painlessmesh-simulator:builder .
      
      - name: Build project in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            painlessmesh-simulator:builder \
            bash -c "mkdir -p build && cd build && \
              cmake -G Ninja .. && \
              ninja"
      
      # Asserts on what the simulator did, not merely that it exited 0. The previous
      # step ran one scenario and tested $? *after* an echo, so its exit check was
      # dead code -- and the scenario it ran passed even when every node failed to
      # load firmware and no message was ever sent.
      - name: Run behavioural integration checks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            painlessmesh-simulator:builder \
            bash -c "./scripts/ci_integration_check.sh ./build/bin/painlessmesh-simulator"
      
      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: results/
        if: always()

  # Performance benchmarks using Docker
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[benchmark]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build --target builder -t painlessmesh-simulator:builder .
      
      - name: Build project in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            painlessmesh-simulator:builder \
            bash -c "mkdir -p build && cd build && \
              cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_BENCHMARKS=ON \
                .. && \
              ninja"
      
      - name: Run benchmarks
        run: |
          # Run stress test scenario at 10x speed (uses config duration of 300s = 30s real time)
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            painlessmesh-simulator:builder \
            bash -c "./build/bin/painlessmesh-simulator --config examples/scenarios/stress_test.yaml --time-scale 10.0 --log-level WARN"
          
          echo "Benchmark completed - check results directory for metrics"
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: results/
        if: always()

  # Documentation build check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      
      - name: Generate documentation
        run: |
          # Will generate once Doxyfile is created
          echo "Documentation generation will be enabled when Doxyfile is added"
          # Future: doxygen Doxyfile
      
      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/html/
        if: always()

  # Security scanning - Disabled because GitHub default CodeQL is enabled
  # If you need custom CodeQL configuration, disable the default CodeQL in repository settings
  # and uncomment this job
  # security:
  #   name: Security Scan
  #   runs-on: ubuntu-latest
  #   
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v6
  #       with:
  #         submodules: recursive
  #     
  #     - name: Run CodeQL analysis
  #       uses: github/codeql-action/init@v3
  #       with:
  #         languages: cpp
  #     
  #     - name: Install dependencies
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y \
  #           cmake \
  #           ninja-build \
  #           libboost-dev \
  #           libboost-system-dev \
  #           libyaml-cpp-dev
  #     
  #     - name: Build for analysis
  #       run: |
  #         cmake -G Ninja -B build
  #         cmake --build build
  #     
  #     - name: Perform CodeQL Analysis
  #       uses: github/codeql-action/analyze@v3

  # Review-loop governor — caps bot review rounds per PR (AGENTS.md § Review
  # round budget). The budget mirrors MAX_REVIEW_ITERATIONS = 3 in the
  # Command Center's pr_review_handler.py; change both together or neither.
  # Past the budget this fails until a human review approves the PR, so the
  # terminal state is a human decision instead of a 39th bot round (PR #59).
  review-budget:
    name: Review round budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Count bot review rounds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MAX_REVIEW_ROUNDS: 3
        run: |
          rounds=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | test("^\\s*@codex review"; "i"))] | length')
          echo "Bot review rounds requested on #$PR: $rounds (budget: $MAX_REVIEW_ROUNDS)"
          if [ "$rounds" -le "$MAX_REVIEW_ROUNDS" ]; then
            echo "Within budget."
            exit 0
          fi
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.state == "APPROVED")] | length')
          if [ "$approvals" -gt 0 ]; then
            echo "Budget exceeded, but a human review has approved this PR — passing."
            exit 0
          fi
          echo "::error::Review round budget exhausted ($rounds/$MAX_REVIEW_ROUNDS)."
          echo "Do NOT post another '@codex review'. Post a summary of the open"
          echo "threads and hand the PR to a human approver; once a human review"
          echo "approves, re-run this check and it will pass."
          exit 1

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, build-docker, test, integration-test, review-budget]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          # integration-test is gated here too. It used to be omitted, so a failing
          # integration run still reported CI success.
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.build-docker.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.integration-test.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          # review-budget is skipped on push events; only a real failure gates.
          if [[ "${{ needs.review-budget.result }}" != "success" ]] && \
             [[ "${{ needs.review-budget.result }}" != "skipped" ]]; then
            echo "Review round budget exhausted — hand this PR to a human approver (see AGENTS.md)."
            exit 1
          fi
          echo "All CI jobs passed successfully!"
